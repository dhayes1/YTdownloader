<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>YouTube Downloader</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <div class="url-box">
        <input
          id="url"
          class="url"
          type="text"
          placeholder="Paste a YouTube link"
          autocomplete="off"
          spellcheck="false"
          aria-label="YouTube link"
        />
        <button id="clear-url" class="clear-url" type="button" title="Clear link (Esc)" aria-label="Clear link" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <section id="tools" class="panel warn" hidden>
        <h2>Some required tools are missing</h2>
        <ul id="tools-list"></ul>
        <p class="hint">Install them, then restart the app. Downloads stay off until they're found.</p>
      </section>

      <p id="probing" class="status-line" hidden>
        <span class="spinner" aria-hidden="true"></span> Getting video info…
      </p>

      <section id="video" class="video" hidden>
        <img id="thumb" class="thumb" alt="" />
        <div class="meta">
          <div id="title" class="title"></div>
          <div id="duration" class="duration"></div>
        </div>
      </section>

      <div class="segmented" role="group" aria-label="Download type">
        <button id="kind-video" type="button">Video</button>
        <button id="kind-mp3" type="button">MP3</button>
      </div>

      <div class="row">
        <select id="quality" class="quality" aria-label="Resolution"></select>
        <button id="folder-btn" class="icon-btn" type="button" title="Choose folder" aria-label="Choose folder">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div id="folder" class="folder-path" title=""></div>

      <button id="download" class="primary" type="button">Download</button>

      <section id="progress" class="progress" hidden>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <div class="progress-row">
          <span id="phase"></span>
          <span id="percent"></span>
        </div>
        <div class="actions">
          <button id="cancel" class="secondary" type="button">Cancel</button>
        </div>
      </section>

      <section id="done" class="panel ok" hidden>
        <div>Saved <span id="done-name" class="done-name"></span></div>
        <button id="open-folder" class="secondary" type="button">Open folder</button>
      </section>

      <p id="error" class="panel error" role="alert" hidden></p>
    </main>
  </body>
</html>
